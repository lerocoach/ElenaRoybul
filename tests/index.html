// Код v2: все ответы упакованы в одно число (смешанная система счисления) + имя и контакт. ~120 символов.
const DAY0=Date.UTC(2026,0,1);
function fields(mode){const F=[];
  if(mode!==2){ for(let k=0;k<SEQ.length;k++)F.push(6); for(let k=0;k<8;k++){F.push(512);F.push(7);} F.push(256); }
  if(mode!==1){ for(let k=0;k<50;k++)F.push(5); }
  F.push(8192); return F;}
const b64u=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
function encode(){
  const mode={both:0,mkp:1,ocean:2}[S.mode]; const vals=[];
  if(mode!==2){ S.a.forEach(v=>vals.push(v-1));
    S.s.forEach(x=>{let m=0;x.th.forEach(i=>m|=1<<(i===99?8:i));vals.push(m);vals.push(x.r);});
    vals.push(Math.min(255,Math.round((S.t1-S.t0)/60000))); }
  if(mode!==1) S.o.forEach(v=>vals.push(v-1));
  vals.push(Math.floor((Date.now()-DAY0)/864e5));
  const F=fields(mode); let n=0n;
  F.forEach((r,k)=>{n=n*BigInt(r)+BigInt(vals[k]);}); n=n*3n+BigInt(mode);
  let hex=n.toString(16); if(hex.length%2)hex="0"+hex;
  const bytes=hex.match(/../g).map(x=>parseInt(x,16));
  const txt=new TextEncoder().encode(S.name+"|"+(S.tg||""));
  return "ek2"+b64u(bytes)+"."+b64u(txt);
}
function decode(code){
  const m2=code.match(/ek2[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]*/);
  if(m2){ const [num,txt]=m2[0].slice(3).split(".");
    let n=BigInt("0x"+[...unb64u(num)].map(b=>b.toString(16).padStart(2,"0")).join(""));
    const mode=Number(n%3n); n/=3n; const F=fields(mode); const vals=Array(F.length);
    for(let k=F.length-1;k>=0;k--){const r=BigInt(F[k]);vals[k]=Number(n%r);n/=r;}
    const [nm,tg]=new TextDecoder().decode(unb64u(txt)).split("|");
    const d=new Date(DAY0+vals[vals.length-1]*864e5).toISOString().slice(0,10);
    const p={v:2,n:nm,tg,d,c:d,x:["both","mkp","ocean"][mode]}; let k=0;
    if(mode!==2){ p.a=vals.slice(0,SEQ.length).map(v=>v+1).join(""); k=SEQ.length; p.s=[];
      for(let j=0;j<8;j++){const m=vals[k++],rr=vals[k++];const th=[];for(let b=0;b<9;b++)if(m&(1<<b))th.push(b===8?99:b);p.s.push([th,rr]);}
      p.m=vals[k++]; }
    if(mode!==1){ p.o=vals.slice(k,k+50).map(v=>v+1).join(""); }
    return p; }
  const mm=code.match(/ЭК1-[A-Za-z0-9_\-]+/); if(mm) code=mm[0];
  let c=code.replace(/\s+/g,"").replace(/^ЭК1-/,"").replace(/-/g,"+").replace(/_/g,"/");
  while(c.length%4)c+="=";
  return JSON.parse(decodeURIComponent(escape(atob(c))));
}

function level(m){ if(m>=5)return[5,"Очень высокая"]; if(m>=4)return[4,"Высокая"]; if(m>=3)return[3,"Средняя"]; if(m>=2)return[2,"Низкая"]; return[1,"Не проявлена"]; }
function scoreMKP(p){
  const a=p.a.split("").map(Number);
  const by={}; SCALES.forEach(s=>by[s.id]=[]);
  const lie=[];
  SEQ.forEach((q,k)=>{ if(q.lie!=null) lie.push(a[k]); else by[q.sc].push(a[k]); });
  const scales=SCALES.map(s=>{const v=by[s.id];const m=v.reduce((x,y)=>x+y,0)/v.length;return {s,m,hi:v.filter(x=>x>=4).length,lv:level(m)}});
  // ситуации
  const offered={},hits={}; SCALES.forEach(s=>{offered[s.id]=0;hits[s.id]=0});
  SCEN.forEach((sc,k)=>{const ids=new Set(sc.o.map(o=>o[1])); const ch=new Set((p.s[k][0]||[]).filter(i=>i<sc.o.length).map(i=>sc.o[i][1]));
    const r=REACT[p.s[k][1]]; if(r&&r[2]) ch.add(r[2]);
    SCALES.forEach(s=>{ if(ids.has(s.id)||["ing","dis","sam"].includes(s.id)) offered[s.id]++; if(ch.has(s.id)) hits[s.id]++; });});
  const rcount={}; p.s.forEach(x=>{const t=RTYPE[x[1]]; if(t) rcount[t]=(rcount[t]||0)+1;});
  const flags=[];
  const hidden=scales.filter(x=>x.m<3&&offered[x.s.id]>0&&hits[x.s.id]/offered[x.s.id]>=0.5);
  hidden.forEach(x=>flags.push(["Скрытая программа: "+x.s.name,`В анкете ${x.m.toFixed(1)}, но в ситуациях выбрана ${hits[x.s.id]} из ${offered[x.s.id]}. Проверить в сессии через ОЗЭРО.`]));
  if(scales.every(x=>x.m<3)) flags.push(["Всё низкое","Все 18 шкал ниже 3,0. По методичке это возможный признак Поломанности: человек привык прятать уязвимость."]);
  const lieHi=lie.filter(x=>x>=5).length;
  if(lieHi>=3) flags.push(["Приукрашивание",`${lieHi} из 5 контрольных утверждений отмечены как «в основном / полностью соответствует». Баллы, скорее всего, занижены.`]);
  if(p.s.every(x=>x[0].length===1&&x[0][0]===99&&x[1]===6)) flags.push(["Не включился","Во всех 8 ситуациях выбраны «ничего особенного» и «спокойно уточняю». Ситуационный блок не дал информации."]);
  let run=1,maxRun=1; for(let k=1;k<a.length;k++){run=a[k]===a[k-1]?run+1:1;maxRun=Math.max(maxRun,run);}
  if((p.m!=null&&p.m<6)||maxRun>=15) flags.push(["Невнимательно",`Время: ${p.m??"—"} мин; самая длинная серия одинаковых ответов: ${maxRun}.`]);
  return {scales,lie,lieHi,offered,hits,rcount,flags};
}
function scoreOCEAN(p){
  const o=p.o.split("").map(Number); const sums=ASP.map(()=>[]);
  OSEQ.forEach((q,k)=>sums[q.a].push(q.r?6-o[k]:o[k]));
  const asp=ASP.map((x,i)=>({x,m:sums[i].reduce((a,b)=>a+b,0)/5}));
  const traits=TRAITS.map(t=>{const as=asp.filter(y=>y.x.trait===t);return {t,as,m:(as[0].m+as[1].m)/2}});
  return traits;
}

  const link=()=>{send.href=`mailto:${(S.mail||COACH_MAIL).trim().replace(/[^A-Za-z0-9._%+\-@]/g,"")}?subject=${encodeURIComponent("Результат теста — "+S.name)}&body=${encodeURIComponent(msgText())}`;};
  mi.value=mail; mi.oninput=()=>{S.mail=mi.value.trim();save();link();}; link();
  const cpy=async(t)=>{const m=app.querySelector("#cpm");
    try{await navigator.clipboard.writeText(t);m.textContent="Скопировано";}catch(e){m.textContent="Не удалось скопировать: выдели и скопируй вручную";}};
  app.querySelector("#cp").onclick=()=>cpy(msgText());
  app.querySelector("#cpa").onclick=()=>cpy((S.mail||COACH_MAIL).trim());
  send.addEventListener("click",()=>{cpy(msgText())});
  app.querySelector("#again").onclick=()=>{clearDraft();S=blank();render();};
  app.querySelector("#pdf").onclick=e=>makePDF(p,false,S.code,e.currentTarget,app.querySelector("#pdfm"));
}
function msgText(){return `Здравствуйте! Отправляю результат теста, PDF во вложении.\n\nИмя: ${S.name}\nКонтакт: ${S.tg||"—"}\n\nРасшифровка по ссылке: ${reportURL(S.code)}\nКод: ${S.code}`}
function coach(){
  document.onkeydown=null;
  app.innerHTML=`<div class="stack"><span class="eyebrow">Для коуча</span><h1>Расшифровка</h1>
   <p class="muted">Вставь письмо, ссылку или код от клиента. Код начинается с «ek2». Ещё быстрее: навести камеру на QR-код в PDF.</p></div>
  <div class="card"><textarea id="in" placeholder="ek2…"></textarea><p class="small" id="err" hidden></p>
   <div class="row"><button class="btn" id="go">Показать</button><button class="ghost" id="back">На главную</button></div></div>`;
  app.querySelector("#back").onclick=()=>{S.phase="start";render()};
  app.querySelector("#go").onclick=()=>{try{const p=decode(app.querySelector("#in").value);if(!p.v)throw 0;S._p=p;S._code=(app.querySelector("#in").value.match(/ek2[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]*|ЭК1-[A-Za-z0-9_\-]+/)||[""])[0];S.phase="report";render();window.scrollTo(0,0)}
    catch(e){const er=app.querySelector("#err");er.hidden=false;er.textContent="Код не читается. Проверь, что он скопирован целиком, от «ЭК1-» до конца.";}};
}
function report(){
  const p=S._p;
  app.innerHTML=`<div class="stack"><span class="eyebrow">Расшифровка для коуча · ${esc(p.d||"")}</span><h1>${esc(p.n||"Клиент")}</h1>${p.tg?`<p class="muted">Контакт: ${esc(p.tg)}</p>`:""}</div>
   ${profileHTML(p,true)}
   <div class="row"><button class="btn" id="pdf">Скачать PDF расшифровки</button><button class="ghost" id="back">Другой код</button><span class="small muted" id="pdfm"></span></div>`;
  app.querySelector("#back").onclick=()=>{S.phase="coach";render()};
  app.querySelector("#pdf").onclick=e=>makePDF(p,true,S._code,e.currentTarget,app.querySelector("#pdfm"));
}
async function makePDF(p,full,code,btn,msg){
  let dl=null; try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  // вне claude.ai: обычное скачивание браузером
  if(!window.html2pdf){msg.textContent="PDF не собрался: не загрузилась библиотека. Обнови страницу и попробуй ещё раз.";return;}
  btn.disabled=true;msg.textContent="Собираю PDF…";
  const el=document.createElement("div");el.className="pdf";
  el.innerHTML=`<div class="stack"><span class="eyebrow">${full?"Расшифровка для коуча":"Результат теста"} · ${esc(p.d||"")}</span><h1>${esc(p.n||"Клиент")}</h1><p class="muted">Контакт: ${esc(p.tg||"—")}${p.c?" · согласие на обработку данных: "+esc(p.c.slice(0,16).replace("T"," ")):""}</p></div>`
    +profileHTML(p,full)+`<div class="card" style="flex-direction:row;gap:16px;align-items:center"><img src="${qrImg(reportURL(code||""),3)}" alt="QR-код расшифровки" style="width:130px;height:130px;flex:none"><div class="stack" style="min-width:0"><h3>Расшифровка для коуча</h3><p class="note">Коуч наводит камеру телефона на QR-код и сразу открывает полную расшифровку. Или вставляет код на странице теста.</p><div class="code" style="max-height:none;user-select:text">${esc(code||"")}</div></div></div>`;
  try{
    const blob=await html2pdf().set({margin:[10,10,12,10],image:{type:"jpeg",quality:0.92},html2canvas:{scale:2,backgroundColor:"#FFFFFF"},jsPDF:{unit:"mm",format:"a4"},pagebreak:{mode:["css","legacy"],avoid:[".sc",".flag","tr","h2"]}}).from(el).outputPdf("blob");
    const nm=(p.n||"клиент").replace(/[\\/:*?"<>|]/g,"").slice(0,60);
    const fn=`${full?"Расшифровка":"Результат теста"} — ${nm}.pdf`;
    if(dl) await dl.save({filename:fn,data:blob}); else {const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
    msg.textContent=full?"PDF сохранён.":"PDF сохранён. Теперь шаг 2.";
  }catch(e){msg.textContent=e&&e.code==="declined"?"Скачивание отменено.":e&&e.code==="rate_limited"?"Окно сохранения уже открыто.":"Не получилось сохранить PDF. Отправь коучу письмо со ссылкой, этого достаточно.";}
  finally{btn.disabled=false;}
}
function bar(m,max,lv){const pct=((m-1)/(max-1))*100;return `<div class="bar"><i style="width:${Math.max(2,pct)}%;background:var(--l${lv})"></i></div>`}
function profileHTML(p,full){
  let h="";
  if(p.a){
    const r=scoreMKP(p);
    if(full){
      h+=`<div class="card"><h2>Флаги</h2>${r.flags.length?r.flags.map(f=>`<div class="flag"><b>${esc(f[0])}</b><p class="small muted">${esc(f[1])}</p></div>`).join(""):`<p class="muted">Флагов нет.</p>`}
       <p class="note">Время прохождения: ${p.m??"—"} мин · контрольные: ${r.lie.join(" ")} (из 6)</p></div>`;
    }
    const top=r.scales.filter(x=>x.m>=4).sort((a,b)=>b.m-a.m);
    h+=`<div class="card"><h2>Метапрограммы</h2>
      ${top.length?`<p class="small">Самые выраженные: <b>${top.map(x=>esc(x.s.name.replace(/ \(.*\)/,""))).join(", ")}</b></p>`:""}
      <table class="rt"><tr><th>Программа</th><th class="c">Балл</th><th>Степень проявленности</th>${full?`<th class="c">Ситуации</th>`:""}</tr>`;
    let need="";
    r.scales.forEach(x=>{ if(x.s.need!==need){ need=x.s.need; h+=`<tr class="grp"><td colspan="${full?4:3}">${esc(need)}</td></tr>`; }
      h+=`<tr${x.lv[0]>=4?' class="hi"':""}><td>${esc(x.s.name.replace(/ \(.*\)/,""))}</td><td class="c num">${x.m.toFixed(1)}</td><td style="color:var(--l${x.lv[0]})">${x.lv[1]}</td>${full?`<td class="c num">${r.offered[x.s.id]?r.hits[x.s.id]+"/"+r.offered[x.s.id]:"—"}</td>`:""}</tr>`;});
    h+=`</table><p class="note">Балл от 1 до 6. Это не диагноз, а карта для работы с коучем.</p>`;
    const rc=Object.entries(r.rcount).sort((a,b)=>b[1]-a[1]);
    h+=`<p class="small"><b>Первая реакция в трудной ситуации:</b> ${rc.map(([t,n])=>`${t} ${n}/8`).join(" · ")}</p></div>`;
    if(full){
      h+=`<div class="card"><h2>Ответы в ситуациях</h2><div class="tblwrap"><table><tr><th>Ситуация</th><th>Мысль → программа</th><th>Реакция</th></tr>
      ${p.s.map((x,k)=>`<tr><td>${esc(SCEN[k].t)}</td><td>${x[0].map(i=>i===99?esc(NEUTRAL):`${esc(SCEN[k].o[i][0])} → <b>${esc(SC[SCEN[k].o[i][1]].name.replace(/ \(.*\)/,""))}</b>`).join("<br>")}</td><td>${esc(REACT[x[1]]?.[1]||"—")}</td></tr>`).join("")}
      </table></div></div>`;
    }
  }
  if(p.o){
    const t=scoreOCEAN(p); const c=m=>m>=3.6?4:m>2.4?3:2;
    h+=`<div class="card"><h2>Пять голосов</h2><table class="rt"><tr><th>Голос</th><th>Уровень</th><th>Аспекты</th></tr>
      ${t.map(x=>`<tr><td>${x.t}</td><td style="color:var(--l${c(x.m)})">${olv(x.m)}</td><td class="small">${x.as.map(a=>`${a.x.name}: ${olv(a.m).toLowerCase()}`).join(", ")}</td></tr>`).join("")}
      </table><p class="note">Перевод утверждений не проверен на русской выборке, используем как ориентир.</p></div>`;
  }
  return h;
}
(function(){const hs=decodeURIComponent(location.hash||"").slice(1);
  if(/^ek2/.test(hs)){try{const p=decode(hs);S._p=p;S._code=hs;S.phase="report";}catch(e){}}})();
render();
</script>
